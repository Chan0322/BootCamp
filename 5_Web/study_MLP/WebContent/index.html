<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" type="text/css" href="./css/loginPage.css">

</head>
<body>
	<div id="loginL">
		<h1>K-Digital Training</h1>
		<h1>교육입과를 환영합니다.</h1>
	</div>
	<div id="loginR">
		<div id="divLoginImg">
			<img src="./src/logo_mlp.png">
		</div>
		<div id="language">
			<select>
				<option>한국어</option>
				<option>영어</option>
				<option>일본어</option>
				<option>중국어</option>
			</select>
		</div>
		<div>
			<form action="member?command=login" method="post">
				<table>
					<tr>
						<td><input type="text" name="id" placeholder="아이디를 입력해 주세요." required="required"></td>
					</tr>
					<tr>
						<td><input type="text" name="pw" placeholder="비밀번호를 입력해 주세요." required="required"></td>
					</tr>
					<tr>
						<td><input type="submit" value="Login"></td>
					</tr>
				</table>
			</form>
			<span>아이디 저장</span>
			<span><a href="#">아이디/비밀번호 찾기</a></span>
		</div>
		<div>
			<p>K-Digital Training는 처음이신가요?</p>
			<span><a href="member?command=insertmemform">회원가입 </a></span>|<span><a> 로그인 안내 </a></span>|<span><a> 오류조치 안내</a></span>
		</div>
	</div>
</body>
</html>
