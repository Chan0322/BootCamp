<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTYPE 쇼핑몰</title>
    <style>
      body {
        margin: 0;
        font-family: "Noto Sans KR", sans-serif;
      }
      /* 상단 네비게이션 */
      header {
        background-color: #fff;
        border-bottom: 1px solid #ddd;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .nav-left,
      .nav-right {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .nav-left a,
      .nav-right a {
        text-decoration: none;
        color: #333;
        font-weight: bold;
      }
      .search-box input {
        padding: 5px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      /* 메인 영역 */
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 70vh;
        background-color: #fafafa;
      }
      .gift-btn {
        padding: 15px 30px;
        background-color: #ff6b6b;
        color: #fff;
        border: none;
        border-radius: 30px;
        font-size: 18px;
        cursor: pointer;
      }
      .icon-buttons {
        margin-top: 20px;
        display: flex;
        gap: 15px;
      }
      .icon-buttons button {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid #ccc;
        background-color: #fff;
        cursor: pointer;
      }
      /* 푸터 */
      footer {
        background-color: #f5f5f5;
        padding: 20px;
        font-size: 14px;
        color: #555;
      }
      .footer-links {
        display: flex;
        gap: 15px;
        margin-bottom: 10px;
      }
      .footer-links a {
        text-decoration: none;
        color: #555;
      }
      .footer-info {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <!-- 상단 네비게이션 -->
    <header>
      <div class="nav-left">
        <a href="#">BEST</a>
        <a href="#">CATEGORY</a>
        <a href="#">MBTI TEST</a>
      </div>
      <div class="search-box">
        <input type="text" placeholder="검색어를 입력하세요" />
      </div>
      <div class="nav-right">
        <a href="#">👤</a>
        <a href="#">🛒</a>
        <a href="#">⋯</a>
      </div>
    </header>

    <!-- 메인 영역 -->
    <main>
      <button class="gift-btn">선물 추천받기</button>
      <div class="icon-buttons">
        <button>❤️</button>
        <button>🔄</button>
      </div>
    </main>

    <!-- 푸터 -->
    <footer>
      <div class="footer-links">
        <a href="#">공지사항</a>
        <a href="#">FAQ</a>
        <a href="#">입점상담</a>
      </div>
      <div class="footer-info">
        상호명: MTYPE(엠타입) | 대표자명: MTYPE(엠타입)<br />
        사업자등록번호: 0000-0000 | 고객센터: 0000-0000<br />
        운영시간: 평일 09:00 ~ 18:00 (토,일, 공휴일 휴무)<br />
        점심시간: 12:00 ~ 13:00<br />
        사업장주소:
      </div>
    </footer>
  </body>
</html>
