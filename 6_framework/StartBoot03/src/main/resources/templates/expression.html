<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>expression</h1>
	<p th:text="'hello, '+${name}">Hello, $name</p>
	<p th:text="|Hello, ${name}|">Hello, $name</p>
	<hr>
	<p th:text="${dto.subject}">dto.subject</p>
	<p th:text="${dto.seq}">dto.seq</p>
	
	<div th:object="${dto}">
		<p th:text="*{subject}">subject</p>
		<p th:text="*{seq}">seq</p>
	</div>
	
	<form th:object="${dto}">
		<input type="text" th:field="*{subject}">
		<input type="text" th:field="*{seq}">
	</form>
	
	<hr>
	<table>
		<tr>
			<th>Subject</th>
			<th>Seq</th>
		</tr>
		<tr th:each="dto:${list}">
			<td th:text="*{dto.Subject}">과목</td>
			<td th:text="*{dto.Seq}">번호</td>
		</tr>
	</table>
	<hr>
	<!-- gt : > / lt : < / ge:>= / le:<= / eq:== / ne:!= -->
	<div th:object="${dto}">
		<p th:if="*{seq gt 30}">
			<span>seq가 30보다 크다</span>
		</p>
		<P th:unless="*{seq gt 30}">
			<span>seq가 30보다 작다</span>
		</P>
	</div>
	&gt;&lt; &ge;&le; &eq;같다, &ne;
	
	<hr>
	<div th:each="num:${#numbers.sequence(1,3)}">
	<!-- block : switch(){} => {} 블록으로 묶는 이 역할 -->
		<th:block th:switch="${num}">
			<p th:case="1" th:text="|this is ${num}|">
			<p th:case="2" th:text="|second ${num}|">
			<p th:case="3" th:text="|bye ${num}|">
		</th:block>
	</div>
	
	
	<hr>
	
	<a th:href="@{/}">index</a>
	<a th:href="@{/test(seq=${dto.seq})}">test</a>
				<!--  /test?seq=22 -->
	
	<form th:object="${dto}" th:action="@{/test}">
		<input type="text" th:field="*{subject}">
		<input type="text" th:field="*{seq}">
		<input type="submit" value="확인">
	</form>
	<!-- /test?subject=Java&seq=22 -->
</body>
</html>
